name: UI Automation Tests

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser'
        required: false
        default: 'chromium'
        type: choice
        options: [ chromium, firefox, webkit ]
      filter:
        description: 'Tag filter (e.g. Smoke, EmployeeManagement, LeaveManagement)'
        required: false
        default: ''

# ─────────────────────────────────────────────────────────────────────────────
# Global env
# ─────────────────────────────────────────────────────────────────────────────
env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  TEST_PROJECT: 'OrangeHRM.UIAutomation.Tests/OrangeHRM.UIAutomation.Tests.csproj'
  APP_REPO: 'priyankapolapallyibm/orangehrm'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: Build — verify test project compiles
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build Test Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: |
          dotnet restore ${{ env.TEST_PROJECT }}
          dotnet build ${{ env.TEST_PROJECT }} \
            --no-restore \
            --configuration Release \
            --verbosity minimal

      - name: List generated SpecFlow files
        run: find . -name "*.feature.cs" | head -20

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2: Full UI Test Suite
# ─────────────────────────────────────────────────────────────────────────────
  ui-tests:
    name: UI Tests — ${{ github.event.inputs.browser || 'chromium' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      # ── Checkout both repos ─────────────────────────────────────────────
      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          path: automation

      - name: Checkout PeopleFlow app repo (public)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          
          path: app

      # ── Setup runtimes ──────────────────────────────────────────────────
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # ── Start PeopleFlow application ────────────────────────────────────
      - name: Install PeopleFlow dependencies
        working-directory: app
        run: npm ci

      - name: Setup Prisma database
        working-directory: app
        run: npm run db:setup

      - name: Start PeopleFlow (API + Web)
        working-directory: app
        run: |
          npm run dev > /tmp/app.log 2>&1 &
          echo "Waiting for API to be ready (max 2 minutes)..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ API ready on attempt $i"
              break
            fi
            printf "  [%d/40] waiting 3s...\n" "$i"
            sleep 3
          done
          curl -sf http://localhost:3000/api/health || { echo "❌ API failed"; cat /tmp/app.log; exit 1; }

      - name: Wait for Web UI
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "✅ Web UI ready on attempt $i"; break
            fi
            sleep 2
          done

      - name: Verify stack
        run: |
          echo "=== API Health ==="
          curl -s http://localhost:3000/api/health
          echo ""
          echo "=== Web UI HTTP ==="
          curl -sI http://localhost:5173 | head -2

      # ── Build automation project ─────────────────────────────────────────
      - name: Restore automation
        working-directory: automation
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build automation
        working-directory: automation
        run: dotnet build ${{ env.TEST_PROJECT }} --no-restore --configuration Release

      # ── Install Playwright ───────────────────────────────────────────────
      - name: Install Playwright browser
        working-directory: automation/OrangeHRM.UIAutomation.Tests
        run: |
          dotnet build --configuration Release
          pwsh bin/Release/net8.0/playwright.ps1 install \
            --with-deps ${{ github.event.inputs.browser || 'chromium' }}

      # ── Run tests ────────────────────────────────────────────────────────
      - name: Run UI Automation Tests
        working-directory: automation
        env:
          TEST_TestSettings__BaseUrl: http://localhost:5173
          TEST_TestSettings__ApiBaseUrl: http://localhost:3000/api
          TEST_TestSettings__Browser: ${{ github.event.inputs.browser || 'chromium' }}
          TEST_TestSettings__Headless: 'true'
          TEST_TestSettings__ScreenshotOnFailure: 'true'
          TEST_TestSettings__DefaultTimeout: '30000'
        run: |
          FILTER="${{ github.event.inputs.filter }}"
          BASE_CMD="dotnet test ${{ env.TEST_PROJECT }} \
            --no-build --configuration Release \
            --logger trx;LogFileName=TestResults.trx \
            --logger console;verbosity=normal"

          if [ -n "$FILTER" ]; then
            echo "🔍 Running with filter: Category=$FILTER"
            $BASE_CMD --filter "Category=$FILTER"
          else
            echo "▶️ Running full test suite"
            $BASE_CMD
          fi

      # ── Artifacts ────────────────────────────────────────────────────────
      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-report-run${{ github.run_number }}
          path: automation/OrangeHRM.UIAutomation.Tests/bin/Release/net8.0/Reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-run${{ github.run_number }}
          path: automation/OrangeHRM.UIAutomation.Tests/bin/Release/net8.0/Reports/Screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload TRX Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trx-run${{ github.run_number }}
          path: automation/**/*.trx
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: NUnit UI Results
          path: automation/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 🧪 UI Test Run Summary"
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| **Browser** | ${{ github.event.inputs.browser || 'chromium' }} |"
            echo "| **Filter** | ${{ github.event.inputs.filter || 'All tests' }} |"
            echo "| **Run #** | ${{ github.run_number }} |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Trigger** | ${{ github.event_name }} |"
            echo ""
            echo "📦 Artifacts: \`html-report-run${{ github.run_number }}\` · \`trx-run${{ github.run_number }}\` · \`screenshots-run${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3: Smoke gate — fast check on every PR (parallel with ui-tests)
# ─────────────────────────────────────────────────────────────────────────────
  smoke-gate:
    name: Smoke Gate
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          path: automation

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          
          path: app

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Start PeopleFlow stack
        working-directory: app
        run: |
          npm ci
          npm run db:setup
          npm run dev > /tmp/app.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health > /dev/null 2>&1 && echo "✅ API ready" && break
            sleep 3
          done
          curl -sf http://localhost:3000/api/health || { cat /tmp/app.log; exit 1; }

      - name: Build automation
        working-directory: automation
        run: |
          dotnet restore ${{ env.TEST_PROJECT }}
          dotnet build ${{ env.TEST_PROJECT }} --no-restore --configuration Release

      - name: Install Playwright chromium
        working-directory: automation/OrangeHRM.UIAutomation.Tests
        run: |
          dotnet build --configuration Release
          pwsh bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run Smoke Tests
        working-directory: automation
        env:
          TEST_TestSettings__BaseUrl: http://localhost:5173
          TEST_TestSettings__ApiBaseUrl: http://localhost:3000/api
          TEST_TestSettings__Browser: chromium
          TEST_TestSettings__Headless: 'true'
        run: |
          dotnet test ${{ env.TEST_PROJECT }} \
            --no-build --configuration Release \
            --filter "Category=Smoke" \
            --logger trx;LogFileName=SmokeResults.trx \
            --logger console;verbosity=normal

      - name: Upload Smoke TRX
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-trx-run${{ github.run_number }}
          path: automation/**/*.trx
          retention-days: 7
          if-no-files-found: warn

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4: Cross-browser matrix — Firefox + WebKit (manual trigger only)
# ─────────────────────────────────────────────────────────────────────────────
  cross-browser:
    name: Cross-Browser — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: ui-tests
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [ firefox, webkit ]

    steps:
      - uses: actions/checkout@v4
        with:
          path: automation

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          
          path: app

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Start PeopleFlow stack
        working-directory: app
        run: |
          npm ci
          npm run db:setup
          npm run dev > /tmp/app.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health > /dev/null 2>&1 && echo "✅ ready" && break
            sleep 3
          done
          curl -sf http://localhost:3000/api/health || { cat /tmp/app.log; exit 1; }

      - name: Build automation
        working-directory: automation
        run: |
          dotnet restore ${{ env.TEST_PROJECT }}
          dotnet build ${{ env.TEST_PROJECT }} --no-restore --configuration Release

      - name: Install Playwright ${{ matrix.browser }}
        working-directory: automation/OrangeHRM.UIAutomation.Tests
        run: |
          dotnet build --configuration Release
          pwsh bin/Release/net8.0/playwright.ps1 install --with-deps ${{ matrix.browser }}

      - name: Run Smoke Tests on ${{ matrix.browser }}
        working-directory: automation
        env:
          TEST_TestSettings__Browser: ${{ matrix.browser }}
          TEST_TestSettings__BaseUrl: http://localhost:5173
          TEST_TestSettings__Headless: 'true'
        run: |
          dotnet test ${{ env.TEST_PROJECT }} \
            --no-build --configuration Release \
            --filter "Category=Smoke" \
            --logger trx;LogFileName=${{ matrix.browser }}-Results.trx \
            --logger console;verbosity=normal

      - name: Upload ${{ matrix.browser }} TRX
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.browser }}-trx-run${{ github.run_number }}
          path: automation/**/*.trx
          retention-days: 14
          if-no-files-found: warn
