name: UI Automation Tests

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser'
        required: false
        default: 'chromium'
        type: choice
        options: [ chromium, firefox, webkit ]
      filter:
        description: 'Tag filter (e.g. Smoke, EmployeeManagement, LeaveManagement) - default: Smoke'
        required: false
        default: 'Smoke'

# ─────────────────────────────────────────────────────────────────────────────
# Global env
# ─────────────────────────────────────────────────────────────────────────────
env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  TEST_PROJECT: 'OrangeHRM.UIAutomation.Tests/OrangeHRM.UIAutomation.Tests.csproj'
  APP_REPO: 'priyankapolapallyibm/orangehrm'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: Build — verify test project compiles
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build Test Project
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Restore & Build
        run: |
          dotnet restore ${{ env.TEST_PROJECT }}
          dotnet build ${{ env.TEST_PROJECT }} \
            --no-restore \
            --configuration Release \
            --verbosity minimal

      - name: List generated SpecFlow files
        run: find . -name "*.feature.cs" | head -20

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2: Full UI Test Suite
# ─────────────────────────────────────────────────────────────────────────────
  ui-tests:
    name: UI Tests — ${{ github.event.inputs.browser || 'chromium' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0-jammy
      options: --memory 4g
    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      # ── Checkout both repos ─────────────────────────────────────────────
      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          path: automation

      - name: Checkout PeopleFlow app repo (public)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: app

      # ── Install runtime dependencies ────────────────────────────────────
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl gnupg ca-certificates apt-transport-https lsb-release

      - name: Setup Node.js repository
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -

      - name: Install Node.js & Git
        run: |
          apt-get install -y nodejs git

      # ── Start PeopleFlow application ────────────────────────────────────
      - name: Install PeopleFlow dependencies
        working-directory: app
        run: npm ci

      - name: Setup Prisma database
        working-directory: app
        run: npm run db:setup

      - name: Start PeopleFlow (API + Web)
        working-directory: app
        run: |
          npm run dev > /tmp/app.log 2>&1 &
          APP_PID=$!
          echo "App PID: $APP_PID"
          echo "$APP_PID" > /tmp/app.pid
          
          echo "Waiting for API to be ready (max 2 minutes)..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ API ready on attempt $i"
              break
            fi
            printf "  [%d/40] waiting 3s...\n" "$i"
            sleep 3
          done
          curl -sf http://localhost:3000/api/health || { echo "❌ API failed"; cat /tmp/app.log; exit 1; }

      - name: Reset database before tests
        working-directory: app
        run: |
          echo "Resetting database to clean state..."
          npm run db:setup 2>&1 | tail -5
          echo "✅ Database reset complete"
           
          # Verify API is still healthy after DB reset
          echo "Verifying API health after database reset..."
          for i in $(seq 1 5); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ API still healthy"
              break
            fi
            echo "⚠️ API health check failed, retrying in 3s..."
            sleep 3
          done

      - name: Verify API health before tests
        run: |
          echo "Final pre-test health check..."
          curl -v http://localhost:3000/api/health 2>&1 | head -15
          echo ""
          echo "✅ Ready for tests"

      - name: Wait for Web UI
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "✅ Web UI ready on attempt $i"; break
            fi
            sleep 2
          done

      - name: Verify stack
        run: |
          echo "=== API Health ==="
          curl -s http://localhost:3000/api/health || { echo "⚠️ API health check failed, retrying..."; sleep 2; curl -s http://localhost:3000/api/health; }
          echo ""
          echo "=== Web UI HTTP ==="
          curl -sI http://localhost:5173 | head -2
          echo ""
          echo "=== App Status ==="
          if [ -f /tmp/app.log ]; then tail -10 /tmp/app.log; fi

      # ── Build automation project ─────────────────────────────────────────
      - name: Restore automation
        working-directory: automation
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build automation
        working-directory: automation
        run: dotnet build ${{ env.TEST_PROJECT }} --no-restore --configuration Release

      # ── Install Playwright ───────────────────────────────────────────────
      - name: Install Playwright browser
        working-directory: automation/OrangeHRM.UIAutomation.Tests
        run: |
          dotnet build --configuration Release
          pwsh bin/Release/net8.0/playwright.ps1 install \
            --with-deps ${{ github.event.inputs.browser || 'chromium' }}

      # ── Run tests ────────────────────────────────────────────────────────
      - name: Run UI Automation Tests
        working-directory: automation
        env:
          TEST_TestSettings__BaseUrl: http://localhost:5173
          TEST_TestSettings__ApiBaseUrl: http://localhost:3000/api
          TEST_TestSettings__Browser: ${{ github.event.inputs.browser || 'chromium' }}
          TEST_TestSettings__Headless: 'true'
          TEST_TestSettings__ScreenshotOnFailure: 'true'
          TEST_TestSettings__DefaultTimeout: '60000'
        run: |
          # Monitor API health in background
          (
            while true; do
              if ! curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "[ALERT] API health check failed at $(date)"
                curl -v http://localhost:3000/api/health 2>&1 | head -5
              fi
              sleep 30
            done
          ) &
          MONITOR_PID=$!
          
          FILTER="${{ github.event.inputs.filter || 'Smoke' }}"
          BASE_CMD="dotnet test ${{ env.TEST_PROJECT }} \
            --no-build --configuration Release \
            --logger trx;LogFileName=TestResults.trx \
            --logger console;verbosity=normal"

          if [ -n "$FILTER" ]; then
            echo "🔍 Running with filter: Category=$FILTER"
            $BASE_CMD --filter "Category=$FILTER"
          else
            echo "▶️ Running full test suite"
            $BASE_CMD
          fi
          TEST_EXIT=$?
          
          # Stop health monitor
          kill $MONITOR_PID 2>/dev/null || true
          
          exit $TEST_EXIT

      - name: Check app status on failure
        if: failure()
        run: |
          echo "=== Checking app status ==="
          curl -v http://localhost:3000/api/health 2>&1 || echo "API unreachable"
          curl -v http://localhost:5173 2>&1 | head -20 || echo "Web UI unreachable"
          echo ""
          echo "=== App logs ==="
          cat /tmp/app.log 2>&1 | tail -50 || echo "No app logs"

      # ── Artifacts ────────────────────────────────────────────────────────
      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-report-run${{ github.run_number }}
          path: automation/OrangeHRM.UIAutomation.Tests/bin/Release/net8.0/Reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-run${{ github.run_number }}
          path: automation/OrangeHRM.UIAutomation.Tests/bin/Release/net8.0/Reports/Screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload TRX Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trx-run${{ github.run_number }}
          path: automation/**/*.trx
          retention-days: 14
          if-no-files-found: warn

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 🧪 UI Test Run Summary"
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| **Browser** | ${{ github.event.inputs.browser || 'chromium' }} |"
            echo "| **Filter** | ${{ github.event.inputs.filter || 'All tests' }} |"
            echo "| **Run #** | ${{ github.run_number }} |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Trigger** | ${{ github.event_name }} |"
            echo ""
            echo "📦 Artifacts: \`html-report-run${{ github.run_number }}\` · \`trx-run${{ github.run_number }}\` · \`screenshots-run${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3: Smoke gate — fast check on every PR (parallel with ui-tests)
# ─────────────────────────────────────────────────────────────────────────────
  smoke-gate:
    name: Smoke Gate
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0-jammy
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          path: automation

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: app

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl gnupg ca-certificates apt-transport-https lsb-release

      - name: Setup Node.js repository
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -

      - name: Install Node.js & Git
        run: |
          apt-get install -y nodejs git

      - name: Start PeopleFlow stack
        working-directory: app
        run: |
          npm ci
          npm run db:setup
          npm run dev > /tmp/app.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health > /dev/null 2>&1 && echo "✅ API ready" && break
            sleep 3
          done
          curl -sf http://localhost:3000/api/health || { cat /tmp/app.log; exit 1; }

      - name: Build automation
        working-directory: automation
        run: |
          dotnet restore ${{ env.TEST_PROJECT }}
          dotnet build ${{ env.TEST_PROJECT }} --no-restore --configuration Release

      - name: Install Playwright chromium
        working-directory: automation/OrangeHRM.UIAutomation.Tests
        run: |
          dotnet build --configuration Release
          pwsh bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run Smoke Tests
        working-directory: automation
        env:
          TEST_TestSettings__BaseUrl: http://localhost:5173
          TEST_TestSettings__ApiBaseUrl: http://localhost:3000/api
          TEST_TestSettings__Browser: chromium
          TEST_TestSettings__Headless: 'true'
        run: |
          dotnet test ${{ env.TEST_PROJECT }} \
            --no-build --configuration Release \
            --filter "Category=Smoke" \
            --logger trx;LogFileName=SmokeResults.trx \
            --logger console;verbosity=normal

      - name: Upload Smoke TRX
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-trx-run${{ github.run_number }}
          path: automation/**/*.trx
          retention-days: 7
          if-no-files-found: warn

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4: Cross-browser matrix — Firefox + WebKit (manual trigger only)
# ─────────────────────────────────────────────────────────────────────────────
  cross-browser:
    name: Cross-Browser — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: ui-tests
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0-jammy
    strategy:
      fail-fast: false
      matrix:
        browser: [ firefox, webkit ]

    steps:
      - uses: actions/checkout@v4
        with:
          path: automation

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: app

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl gnupg ca-certificates apt-transport-https lsb-release

      - name: Setup Node.js repository
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -

      - name: Install Node.js & Git
        run: |
          apt-get install -y nodejs git

      - name: Start PeopleFlow stack
        working-directory: app
        run: |
          npm ci
          npm run db:setup
          npm run dev > /tmp/app.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health > /dev/null 2>&1 && echo "✅ ready" && break
            sleep 3
          done
          curl -sf http://localhost:3000/api/health || { cat /tmp/app.log; exit 1; }

      - name: Build automation
        working-directory: automation
        run: |
          dotnet restore ${{ env.TEST_PROJECT }}
          dotnet build ${{ env.TEST_PROJECT }} --no-restore --configuration Release

      - name: Install Playwright ${{ matrix.browser }}
        working-directory: automation/OrangeHRM.UIAutomation.Tests
        env:
          HOME: /root
        run: |
          dotnet build --configuration Release
          pwsh bin/Release/net8.0/playwright.ps1 install --with-deps ${{ matrix.browser }}

      - name: Run Smoke Tests on ${{ matrix.browser }}
        working-directory: automation
        env:
          TEST_TestSettings__Browser: ${{ matrix.browser }}
          TEST_TestSettings__BaseUrl: http://localhost:5173
          TEST_TestSettings__Headless: 'true'
          HOME: /root
        run: |
          dotnet test ${{ env.TEST_PROJECT }} \
            --no-build --configuration Release \
            --filter "Category=Smoke" \
            --logger trx;LogFileName=${{ matrix.browser }}-Results.trx \
            --logger console;verbosity=normal

      - name: Upload ${{ matrix.browser }} TRX
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.browser }}-trx-run${{ github.run_number }}
          path: automation/**/*.trx
          retention-days: 14
          if-no-files-found: warn
